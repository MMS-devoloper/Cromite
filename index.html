<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Mobile New Tab</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: #000;
            color: #e3e3e3;
            display: flex;
            justify-content: center;
        }

        .phone-container {
            width: 100%;
            max-width: 412px;
            background-color: #1a1a1c;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding-top: 10px;
        }

        /* --- Click Animations (Touch Feedback) --- */
        .search-icon:active, .action-btn:active, 
        .shortcut:active, .tips-content button:active, 
        .news-item:active {
            opacity: 0.6;
            transform: scale(0.95);
            transition: all 0.1s ease;
        }

        .action-btn, .shortcut, .news-item, .tips-content button {
            transition: all 0.2s ease;
        }

        /* Logo */
        .logo-container {
            text-align: center;
            margin: 30px 0 24px;
        }

        .logo-container h1 {
            font-family: 'Product Sans', sans-serif;
            font-size: 42px;
            font-weight: 500;
            letter-spacing: -1px;
            color: #ffffff;
        }

        /* Search Bar */
        .search-wrapper {
            padding: 0 16px;
            margin-bottom: 12px;
        }

        .search-bar {
            background-color: #36373a;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 14px 18px;
            gap: 12px;
        }

        form.search-form {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 12px;
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            width: 100%;
        }

        .search-bar input::placeholder {
            color: #c4c7c5;
        }

        .search-icon svg {
            width: 22px;
            height: 22px;
            fill: #c4c7c5;
            cursor: pointer;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            padding: 0 16px;
            margin-bottom: 24px;
        }

        .action-btn {
            flex: 1;
            background-color: #36373a;
            padding: 14px;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #e3e3e3;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
            fill: #e3e3e3;
        }

        /* Shortcuts */
        .shortcuts-container {
            background-color: #202124;
            border-radius: 24px;
            margin: 0 16px 16px;
            padding: 16px 8px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        
        .shortcuts-container::-webkit-scrollbar {
            display: none;
        }

        .shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 68px;
            cursor: pointer;
            text-decoration: none;
        }

        .shortcut-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: #36373a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .shortcut-text {
            font-size: 12px;
            color: #c4c7c5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        /* Chrome Tips */
        .tips-card {
            background-color: #202124;
            border-radius: 24px;
            margin: 0 16px 16px;
            padding: 16px 20px 20px;
        }

        .tips-header {
            font-size: 13px;
            color: #c4c7c5;
            margin-bottom: 16px;
        }

        .tips-body {
            display: flex;
            gap: 16px;
        }

        .tips-graphic {
            width: 70px;
            height: 70px;
            background-color: #2b3950;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .tips-graphic::before, .tips-graphic::after {
            content: '→';
            position: absolute;
            color: #7baaf7;
            font-size: 12px;
        }
        .tips-graphic::before { left: 8px; transform: scaleX(-1); }
        .tips-graphic::after { right: 8px; }

        .tips-graphic .phone-mock {
            width: 24px;
            height: 40px;
            border: 2px solid #a8c7fa;
            border-radius: 6px;
        }

        .tips-content h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #e3e3e3;
        }

        .tips-content p {
            font-size: 13px;
            color: #9aa0a6;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .tips-content button {
            background-color: #a8c7fa;
            color: #062e6f;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 14px;
            float: right;
            cursor: pointer;
            outline: none;
        }

        /* News Feed (Discover Section) */
        .discover-section {
            background-color: #202124;
            border-radius: 24px 24px 0 0;
            margin: 0 16px;
            padding-top: 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .news-item {
            display: flex;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid #3c4043;
            cursor: pointer;
            text-decoration: none;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-text {
            flex: 1;
        }

        .news-text h3 {
            font-size: 17px;
            font-weight: 400;
            line-height: 1.4;
            color: #e3e3e3;
            margin-bottom: 12px;
        }

        .news-footer {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .source-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
        }

        .news-thumbnail {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            background-color: #36373a;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        /* Loader */
        .loader-container {
            padding: 20px;
            text-align: center;
            color: #9aa0a6;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #9aa0a6;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="phone-container">

        <div class="logo-container">
            <h1>Google</h1>
        </div>

        <div class="search-wrapper">
            <div class="search-bar">
                <form class="search-form" onsubmit="performSearch(event)">
                    <svg viewBox="0 0 24 24" width="22" height="22" onclick="window.open('https://google.com', '_blank')" style="cursor: pointer;">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search Google or type...">
                    <div class="search-icon" onclick="alert('Opening Voice Search...')">
                        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                    </div>
                    <div class="search-icon" onclick="alert('Opening Google Lens...')">
                        <svg viewBox="0 0 24 24"><path d="M19 8h-1V6c0-1.1-.9-2-2-2h-3v2h3v2h-1c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h3c1.1 0 2-.9 2-2v-6c0-1.1-.9-2-2-2zm-1 8h-3v-6h3v6zm-7-2H8v-2h3V9H8V7h3V5H8c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h3v-1zm-3-3H6v-2h2v2z"/></svg>
                    </div>
                </form>
            </div>
        </div>

        <div class="action-buttons">
            <a href="https://www.google.com/search?q=&client=ms-android-xiaomi-terr1-rso2&sourceid=chrome-mobile&ie=UTF-8&udm=50&aep=43&cud=0&source=chrome.crn.obic" class="action-btn">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 10h-2v2h-2v-2h-2v-2h2V9h2v2h2v2z"/></svg>
                AI Mode
            </a>
            <div class="action-btn" onclick="alert('Opening New Incognito Tab...')">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
                Incognito
            </div>
        </div>

        <div class="shortcuts-container">
            <a href="https://facebook.com" target="_blank" class="shortcut">
                <div class="shortcut-icon" style="background:#1877F2; font-size: 28px;">f</div>
                <div class="shortcut-text">Facebook</div>
            </a>
            <a href="https://youtube.com" target="_blank" class="shortcut">
                <div class="shortcut-icon" style="background:#282828;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="red"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                </div>
                <div class="shortcut-text">YouTube</div>
            </a>
            <a href="https://cricbuzz.com" target="_blank" class="shortcut">
                <div class="shortcut-icon" style="background:#009270; font-size: 18px;">cb</div>
                <div class="shortcut-text">Cricbuzz</div>
            </a>
            <a href="https://espncricinfo.com" target="_blank" class="shortcut">
                <div class="shortcut-icon" style="background:#000;">
                    <div style="width: 24px; height: 24px; background: #00B1FF; border-radius: 4px;"></div>
                </div>
                <div class="shortcut-text">ESPNcric...</div>
            </a>
            <a href="https://bikroy.com" target="_blank" class="shortcut">
                <div class="shortcut-icon" style="background:#36373A;">B</div>
                <div class="shortcut-text">Bikroy</div>
            </a>
        </div>

        <div class="tips-card">
            <div class="tips-header">Chrome tips</div>
            <div class="tips-body">
                <div class="tips-graphic">
                    <div class="phone-mock"></div>
                </div>
                <div class="tips-content">
                    <h3>Choose address bar position</h3>
                    <p>Switch the position to customize your ...</p>
                    <button onclick="alert('Opening Chrome Settings...')">Go to settings</button>
                </div>
            </div>
        </div>

        <div class="discover-section" id="news-feed">
            </div>
        
        <div class="loader-container" id="loading-trigger">
            <div class="spinner"></div>
            Loading more...
        </div>

    </div>

    <script>
        // Google Search Functionality
        function performSearch(event) {
            event.preventDefault(); 
            const query = document.getElementById('searchInput').value;
            if (query.trim() !== '') {
                window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
            }
        }

        // Dummy data for generating random news
        const newsDatabase = [
            { title: "'No sign of survivors' at Chinese border crossing as Nepal flooding death toll rises", source: "CNN", time: "2h", color: "#CC0000" },
            { title: "Tech giant unveils new AI model capable of understanding complex human emotions", source: "The Verge", time: "5h", color: "#E0245E" },
            { title: "Bangladesh wins the final match against Australia in a thrilling finish", source: "ESPNcricinfo", time: "1h", color: "#00B1FF" },
            { title: "Global stock markets see a massive surge following tech earnings report", source: "Bloomberg", time: "3h", color: "#28C840" },
            { title: "New James Webb Telescope image reveals galaxy forming at the dawn of time", source: "Space.com", time: "7h", color: "#1D237A" },
            { title: "Upcoming smartphone leaks suggest a massive 200MP camera upgrade", source: "TechRadar", time: "45m", color: "#FF8C00" },
            { title: "Scientists discover new bioluminescent species deep in the Pacific Ocean", source: "National Geographic", time: "6h", color: "#FFD700" },
            { title: "Local chef wins international culinary award for innovative fusion dishes", source: "Food Network", time: "12h", color: "#DC143C" }
        ];

        const newsFeedContainer = document.getElementById('news-feed');
        const loadingTrigger = document.getElementById('loading-trigger');

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function createNewsCard() {
            const news = getRandomItem(newsDatabase);
            const randomImageId = Math.floor(Math.random() * 1000); 
            
            const searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(news.title);
            
            const card = document.createElement('a');
            card.className = 'news-item';
            card.href = searchUrl;
            card.target = '_blank';
            
            card.innerHTML = `
                <div class="news-text">
                    <h3>${news.title}</h3>
                    <div class="news-footer">
                        <span class="source-icon" style="background-color: ${news.color}"></span>
                        <span style="font-size: 12px; color: #9aa0a6;">${news.source} · ${news.time}</span>
                    </div>
                </div>
                <div class="news-thumbnail" style="background-image: url('https://picsum.photos/120/120?random=${randomImageId}')"></div>
            `;
            
            return card;
        }

        function loadMoreNews(count = 3) {
            for (let i = 0; i < count; i++) {
                const newCard = createNewsCard();
                newsFeedContainer.appendChild(newCard);
            }
        }

        // Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            loadMoreNews(4);
        });

        // Infinite Scroll Logic
        const observerOptions = {
            root: null, 
            rootMargin: '0px',
            threshold: 0.1 
        };

        const observer = new IntersectionObserver((entries) => {
            const entry = entries[0];
            if (entry.isIntersecting) {
                setTimeout(() => {
                    loadMoreNews(3);
                }, 800);
            }
        }, observerOptions);

        observer.observe(loadingTrigger);

    </script>
</body>
</html>
